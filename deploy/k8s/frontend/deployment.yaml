# =============================================================
# deployment.yaml — Frontend Kubernetes Deployment
#
# A Deployment tells Kubernetes HOW to run the frontend pods:
#   - How many replicas (copies) to keep running
#   - Which Docker image to use
#   - Resource limits (CPU/memory)
#   - Health check probes
#   - Environment variables
#
# ArgoCD watches this file in Git. When Jenkins updates the
# image tag and pushes, ArgoCD detects the change and rolls
# out the new version automatically (zero-downtime).
# =============================================================

apiVersion: apps/v1   # Deployment is in the 'apps' API group
kind: Deployment
metadata:
  name: frontend                  # Name used by kubectl to reference this deployment
  namespace: devops-showcase      # Isolated namespace for this project
  labels:
    app: frontend
    version: v1
spec:
  replicas: 2   # Run 2 pod replicas for high availability
                # If one node dies, the other pod keeps serving traffic

  # selector tells the Deployment which pods it owns/manages
  # Must match the template labels below
  selector:
    matchLabels:
      app: frontend

  # Rolling update strategy: deploy new pods before killing old ones
  # This ensures ZERO downtime during deployments
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Allow 1 extra pod above desired count during rollout
      maxUnavailable: 0  # Never go below desired count (no downtime)

  template:
    metadata:
      labels:
        app: frontend
        version: v1
      annotations:
        # Tell Prometheus to scrape metrics from this pod
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'    # Port where /metrics is exposed
        prometheus.io/path: '/metrics'
    spec:
      containers:
        - name: frontend
          # Image tag is updated by Jenkins CI on every successful build
          # Format: <account>.dkr.ecr.<region>.amazonaws.com/devops-showcase/frontend:<build_number>
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/devops-showcase/frontend:latest

          ports:
            - containerPort: 3000   # Port the Express app listens on inside the container

          # Environment variables injected into the container at runtime
          env:
            - name: PORT
              value: "3000"
            # URL of product-service — resolves via Kubernetes DNS (ClusterIP service)
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:4000"
            # URL of order-service — resolves via Kubernetes DNS
            - name: ORDER_SERVICE_URL
              value: "http://order-service:5000"
            - name: APP_VERSION
              value: "1.0.0"

          # Resource requests: minimum guaranteed resources (used for scheduling)
          # Resource limits: hard cap to prevent one pod starving others
          resources:
            requests:
              cpu: "100m"     # 0.1 vCPU minimum
              memory: "128Mi" # 128 MB minimum
            limits:
              cpu: "250m"     # 0.25 vCPU max
              memory: "256Mi" # 256 MB max

          # Liveness probe: K8s restarts the pod if this fails
          # Checks /health every 10s; allows 3 failures before restart
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15  # Wait 15s after container start before probing
            periodSeconds: 10        # Check every 10 seconds
            failureThreshold: 3      # Restart after 3 consecutive failures

          # Readiness probe: K8s only sends traffic when this passes
          # Prevents sending requests to pods that aren't ready yet
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5   # Shorter delay — readiness checked sooner
            periodSeconds: 5
            failureThreshold: 3
